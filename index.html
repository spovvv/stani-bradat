<!doctype html>
<html lang="bg">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>СТАНИ БРАДАТ</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="viewport">
    <div id="app" class="app" aria-label="Стани Брадат - игра">
      <img id="stageImg" class="stage" src="assets/00-Neutral.png" alt="" />

      <button id="btnNewGame" class="pill btn-newgame" type="button" aria-label="Нова Игра">
        <span class="pill-text">Нова Игра</span>
      </button>

      <button id="btnNext" class="pill btn-next is-disabled" type="button" aria-label="Напред">
        <span class="pill-text">Напред</span>
      </button>

      <div class="side-stats" aria-live="polite">
        <div class="stat">
          <div class="stat-label">Познати<br>отговори</div>
          <div id="knownValue" class="stat-value">0</div>
        </div>
        <div id="gradeStat" class="stat">
          <div class="stat-label">Текуща<br>оценка</div>
          <div id="gradeValue" class="stat-value">—</div>
        </div>
      </div>

      <div id="question" class="question" aria-live="polite"></div>

      <div class="answers" role="group" aria-label="Отговори">
        <button class="answer" data-idx="0" type="button"><span class="answer-bg"></span><span class="answer-text" id="ans0"></span></button>
        <button class="answer" data-idx="1" type="button"><span class="answer-bg"></span><span class="answer-text" id="ans1"></span></button>
        <button class="answer" data-idx="2" type="button"><span class="answer-bg"></span><span class="answer-text" id="ans2"></span></button>
        <button class="answer" data-idx="3" type="button"><span class="answer-bg"></span><span class="answer-text" id="ans3"></span></button>
      </div>

      <div class="credit">Играта и героите са създадени от Свилен Петров - spovv</div>
    </div>
  </div>
  <script src="game.js"></script>
</body>
</html>
