<!doctype html>
<html lang="bg">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Стани Брадат</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main id="gameRoot" aria-label="Стани Брадат">
    <img id="stageImg" class="stage" src="assets/00-Neutral.png" alt="" draggable="false">

    <button id="btnNewGame" class="topButton newGame" type="button">
      <span>Нова Игра</span>
    </button>

    <button id="btnNext" class="topButton next is-disabled" type="button">
      <span>Напред</span>
    </button>

    <aside class="sideStats" aria-live="polite">
      <section class="statBox">
        <div class="statLabel">Познати<br>отговори</div>
        <div id="knownValue" class="statValue">0</div>
      </section>
      <section class="statBox gradeBox">
        <div class="statLabel">Текуща<br>оценка</div>
        <div id="gradeValue" class="statValue">—</div>
      </section>
    </aside>

    <section id="question" class="questionText" aria-live="polite"></section>

    <section class="answers" aria-label="Отговори">
      <button class="answer" type="button" data-pos="0"><span></span></button>
      <button class="answer" type="button" data-pos="1"><span></span></button>
      <button class="answer" type="button" data-pos="2"><span></span></button>
      <button class="answer" type="button" data-pos="3"><span></span></button>
    </section>

    <footer class="credit">Играта и героите са създадени от Свилен Петров - spovv</footer>
  </main>

  <script src="game.js"></script>
</body>
</html>
